<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message for Momo</title>
    <style>
        /* Centers everything on the screen and sets a dark background */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Initial state of the text/image container (invisible) */
        #message-container {
            font-size: 5rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            text-align: center;
        }

        /* Class added by JavaScript to trigger the fade-in effect */
        .show {
            opacity: 1 !important;
        }

        /* Adds a nice red color to the heart */
        .heart {
            color: #ff4d4d;
        }

        /* Controls the size of the animated GIF */
        .kiss-gif {
            width: 250px;
            height: auto;
        }
    </style>
</head>
<body>

    <div id="message-container"></div>

    <script>
        const messageContainer = document.getElementById('message-container');

        // Step 1: At 3 seconds, show "Momo"
        setTimeout(() => {
            messageContainer.innerHTML = "Momo";
            messageContainer.classList.add('show');
        }, 3000);

        // Step 2: Fade out "Momo" at 5.5 seconds
        setTimeout(() => {
            messageContainer.classList.remove('show');
        }, 5500);

        // Step 3: At 6 seconds, show "I Love You"
        setTimeout(() => {
            messageContainer.innerHTML = "I Love You <span class='heart'>❤</span>";
            messageContainer.classList.add('show');
        }, 6000);

        // Step 4: Fade out "I Love You" 5 seconds later (at 10.5 seconds total)
        setTimeout(() => {
            messageContainer.classList.remove('show');
        }, 10500);

        // Step 5: At 11 seconds total, show the animated kiss GIF
        setTimeout(() => {
            messageContainer.innerHTML = "<img src='https://fonts.gstatic.com/s/e/notoemoji/latest/1f618/512.gif' alt='Kiss' class='kiss-gif'>";
            messageContainer.classList.add('show');
        }, 11000);
    </script>

</body>
</html>
