<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message for Momo</title>
    <style>
        /* Centers everything on the screen and sets a dark background */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Initial state of the text container (invisible) */
        #message-container {
            font-size: 5rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            text-align: center;
        }

        /* Class added by JavaScript to trigger the fade-in effect */
        .show {
            opacity: 1 !important;
        }

        /* Adds a nice red color to the heart */
        .heart {
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div id="message-container"></div>

    <script>
        const messageContainer = document.getElementById('message-container');

        // Step 1: After 3 seconds (3000 milliseconds), show "Momo"
        setTimeout(() => {
            messageContainer.innerHTML = "Momo";
            messageContainer.classList.add('show');
        }, 3000);

        // Step 2: Fade the text out half a second before the next word appears
        setTimeout(() => {
            messageContainer.classList.remove('show');
        }, 5500);

        // Step 3: After 6 seconds total (3 seconds after Momo), show "I Love You"
        setTimeout(() => {
            messageContainer.innerHTML = "I Love You <span class='heart'>❤</span>";
            messageContainer.classList.add('show');
        }, 6000);
    </script>

</body>
</html>
